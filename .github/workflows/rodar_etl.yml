name: Pipeline Diario de ETL (Acessibilidade Gov.br)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  executar-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar versao do Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias do Python
        run: |
          python -m pip install --upgrade pip
          pip install pypdf psycopg2-binary python-dotenv requests beautifulsoup4

      - name: Executar Script de Importacao de PDFs
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: "5432"
        run: python etl/parser_carta.py

      - name: Executar Coletor de Avaliações
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: "5432"
        run: python etl/coletor_avaliacoes.py